name: CI

# Прогоняется при создании и обновлении PR в main.
# Branch protection (Settings → Branches) делает эти проверки обязательными.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Отменяем предыдущие запуски для того же PR при новом пуше.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node 24 — из-за npm, а не из-за самого Node. `npm ci` требует полного совпадения
# lock с деревом зависимостей, а npm 10 (Node 20 и 22) и npm 11 (Node 24)
# по-разному поступают с неудовлетворёнными optional peerDependencies:
# `@bomb.sh/tab` (приходит с `@nuxt/cli`) просит `commander ^13||^14||^15`, а в
# дереве верхнеуровневый `commander@10`. npm 11 вложенную копию в lock не пишет,
# npm 10 её оттуда требует и падает с «Missing: commander@N from lock file».
# Поэтому CI держим на той же мажорной версии npm, на которой lock собирается
# при разработке.

jobs:
  lint:
    name: Линтинг текстов песен
    # Имя job'а менять нельзя: branch protection ссылается на required check
    # по имени, переименование навсегда оставит проверку в pending.
    #
    # `songs:lint` — полный прогон, поэтому кроме формата .txt он проверяет
    # согласованность sections.json с песнями: разделы — часть базы, и битые
    # разделы не должны попадать в main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run songs:lint

  unit-tests:
    name: Unit-тесты (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Платформо-специфичные бинарники для Linux (lockfile создавался на macOS).
      - run: npm ci --ignore-scripts
      - run: npm install @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 --no-save
      - run: npm run postinstall
      - run: npx vitest run

  e2e-tests:
    name: E2E-тесты (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm install @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 --no-save
      - run: npm run postinstall
      # Браузер Playwright + системные зависимости.
      - run: npx playwright install --with-deps chromium
      # webServer в playwright.config.js сам поднимает npm run dev
      # (который включает songs:parse → генерация songs.json).
      - run: npm run test:e2e
      # Отчёт полезен для отладки упавших тестов.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
